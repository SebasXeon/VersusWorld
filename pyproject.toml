[project]
name = "versusworld"
version = "0.1.0"
description = "VersusBot World Tournament — country conquest via Facebook reactions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bunnet>=1.3.0",
    "cartopy>=0.25.0",
    "facebook-sdk>=3.1.0",
    "numpy>=2.0.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.0.0",
    "pykdtree>=1.4.3",
    "pymongo>=4.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "typer>=0.12.0",
]

[project.scripts]
versusworld = "versusworld.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["versusworld"]
