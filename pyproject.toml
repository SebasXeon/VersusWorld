[project]
name = "versusworld"
version = "0.1.0"
description = "VersusBot World Tournament — country conquest via Facebook reactions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bunnet",
    "cartopy",
    "facebook-sdk",
    "numpy",
    "pillow",
    "pydantic-settings",
    "pykdtree",
    "pymongo",
    "python-dotenv",
    "requests",
    "typer",
]

[project.scripts]
versusworld = "versusworld.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["versusworld"]
